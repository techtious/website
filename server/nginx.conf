# Place this in /etc/nginx/sites-available/api.techtious.com
# then: ln -s /etc/nginx/sites-available/api.techtious.com /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name api.techtious.com;

    # Redirect HTTP → HTTPS (certbot will add this automatically)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.techtious.com;

    # SSL — managed by certbot
    ssl_certificate     /etc/letsencrypt/live/api.techtious.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.techtious.com/privkey.pem;

    # Disable buffering for SSE streaming
    proxy_buffering off;
    proxy_cache off;

    location /api/chat {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # SSE — keep connection open
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
        chunked_transfer_encoding on;
    }

    location /health {
        proxy_pass http://127.0.0.1:3001;
    }
}
